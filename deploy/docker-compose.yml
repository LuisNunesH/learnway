# Stack que roda na VM da Oracle Cloud.
#
# Dois contêineres: a API e um proxy reverso (Caddy) que resolve HTTPS sozinho.
# O HTTPS não é luxo aqui — o frontend fica no Cloudflare Pages, que serve por
# HTTPS, e o navegador BLOQUEIA uma página https chamando uma API http
# ("mixed content"). Sem TLS no backend, o app publicado simplesmente não
# funcionaria.
#
# Este arquivo vive em ~/learnway/docker-compose.yml na VM.
# O deploy só faz: docker compose pull && docker compose up -d

services:
  api:
    # A tag é injetada pelo workflow (arquivo .env ao lado deste).
    image: ${API_IMAGE}
    container_name: learnway-api
    restart: unless-stopped

    # Publicada SÓ no loopback da VM. O "127.0.0.1:" na frente é o que importa:
    # sem ele, o Docker abriria a 8080 para a internet inteira, furando o
    # firewall (o Docker escreve regras de iptables por baixo do ufw). Assim o
    # acesso externo passa obrigatoriamente pelo Caddy com TLS, e ainda dá para
    # depurar de dentro da VM com `curl localhost:8080`.
    ports:
      - "127.0.0.1:8080:8080"

    env_file:
      - ./api.env

    environment:
      # Repete os flags do Dockerfile porque JAVA_TOOL_OPTIONS é uma variável
      # só: definir aqui SUBSTITUI o valor da imagem inteiro, não acrescenta.
      #
      # 60% de 720m dá ~430 MB de heap, e sobram ~290 MB para metaspace, code
      # cache e pilhas de thread — que não entram no heap e são o que costuma
      # estourar quando se olha só para o -Xmx. Na imagem o valor é 70, certo
      # para uma máquina maior; aqui a margem precisa ser outra.
      JAVA_TOOL_OPTIONS: >-
        -XX:MaxRAMPercentage=60
        -XX:+UseSerialGC
        -Xss512k
        -Djava.security.egd=file:/dev/./urandom

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      # A app leva alguns segundos para subir; até lá o healthcheck não conta
      # como falha (é o que start_period faz).
      start_period: 90s
      timeout: 5s
      retries: 3

    # A VM inteira tem 956 MB. O teto não é só higiene contra vazamento: é o
    # número que a JVM lê para dimensionar o heap (MaxRAMPercentage). Deixar em
    # 2g numa máquina de 1 GB faria a JVM planejar um heap que não existe, e o
    # kernel mataria o processo antes de qualquer GC adiantar.
    #
    # 720m para a API, ~30m para o Caddy, ~200m para o sistema. O resto é a
    # folga que o swap de 2 GB cobre nos picos.
    mem_limit: 720m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    container_name: learnway-caddy
    restart: unless-stopped
    ports:
      - "80:80"     # necessária mesmo em HTTPS: é por ela que o Let's Encrypt valida
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Os certificados vivem aqui. Sem este volume, cada restart pediria
      # certificado novo e você bateria no limite do Let's Encrypt.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
