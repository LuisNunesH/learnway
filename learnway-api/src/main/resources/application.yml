spring:
  application:
    name: learnway-api

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      # Neon (free tier) suspende a compute; a 1ª conexão precisa "acordar" o banco.
      connection-timeout: 60000
      initialization-fail-timeout: 60000
      validation-timeout: 10000
      keepalive-time: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # Seeds didáticos contêm ${...} literal (ex.: @Value("${...}") na teoria);
    # sem isto o Flyway tentaria resolvê-los como placeholders.
    placeholder-replacement: false
    # Tolera cold start do Neon: tenta reconectar antes de falhar.
    connect-retries: 10
    connect-retries-interval: 5

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  # Login social. Crie as credenciais e exporte as variáveis de ambiente:
  #   Google: https://console.cloud.google.com/apis/credentials
  #     - redirect URI autorizada: http://localhost:8080/login/oauth2/code/google
  #   GitHub: https://github.com/settings/developers (OAuth Apps)
  #     - callback URL: http://localhost:8080/login/oauth2/code/github
  # Os defaults "unset" mantêm o boot funcionando sem as chaves (o botão
  # social só falha ao ser clicado, com erro do provedor).
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:unset}
            client-secret: ${GOOGLE_CLIENT_SECRET:unset}
            scope: openid, profile, email
          github:
            client-id: ${GITHUB_CLIENT_ID:unset}
            client-secret: ${GITHUB_CLIENT_SECRET:unset}
            scope: read:user, user:email

server:
  # Cloud Run (e a maioria dos PaaS) injeta a porta em PORT e espera que o
  # contêiner escute exatamente nela. Com 8080 fixo o app sobe mas o roteador
  # não o encontra, e o deploy falha por health check.
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

# Application-specific configuration
learnway:
  # Fuso de referência para tudo que é "dia civil" (streak, calendário,
  # heatmap, data da sessão). Instantes seguem gravados em UTC.
  timezone: ${APP_TIMEZONE:America/Sao_Paulo}
  session:
    # Teto de uma sessão de estudo: nada além disso é tempo real de estudo,
    # é aba esquecida aberta.
    max-minutes: ${SESSION_MAX_MINUTES:240}
    # Sem heartbeat por este tempo, a sessão é considerada abandonada e
    # fechada no último sinal de vida.
    idle-timeout-minutes: ${SESSION_IDLE_TIMEOUT_MINUTES:10}
    # Fora da tela o cronômetro fica pausado (esse tempo não é creditado).
    # Passada esta folga, a sessão é encerrada onde a pausa começou: voltar
    # horas depois tem de abrir uma sessão nova, no dia certo do gráfico.
    pause-grace-minutes: ${SESSION_PAUSE_GRACE_MINUTES:180}
  jwt:
    # Base64-encoded 256-bit secret. Override in production via JWT_SECRET.
    secret: ${JWT_SECRET:Y2hhbmdlLW1lLXRoaXMtaXMtYS1kZXYtb25seS1zZWNyZXQtMjU2LWJpdC1rZXktMDAwMQ==}
    access-token-expiration-minutes: 60
    refresh-token-expiration-days: 30
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  oauth:
    # Após o login social, o backend redireciona para cá com os JWTs no fragment.
    frontend-redirect-uri: ${OAUTH_FRONTEND_REDIRECT:http://localhost:4200/oauth/callback}
    failure-redirect-uri: ${OAUTH_FAILURE_REDIRECT:http://localhost:4200/entrar?error=oauth}
  review:
    # Daily streak goal and scheduler cadence
    scheduler-cron: "0 0 * * * *"   # every hour

gemini:
  api-key: ${GEMINI_API_KEY:}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
  model: ${GEMINI_MODEL:gemini-3.5-flash}
  # Modelos "pensantes" (3.5+) gastam parte do orçamento em raciocínio interno —
  # 1024 truncava avaliações JSON antes de o texto final sair.
  max-output-tokens: 4096
  temperature: 0.3
  timeout-seconds: 30

# Provedor reserva: quando a Gemini falha (503 "high demand" etc.), a mesma requisição
# é reenviada para a Groq antes de devolver erro ao usuário. Chave gratuita em
# https://console.groq.com/keys — exporte como GROQ_API_KEY.
groq:
  api-key: ${GROQ_API_KEY:}
  base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
  model: ${GROQ_MODEL:llama-3.3-70b-versatile}
  max-output-tokens: 4096
  temperature: 0.3
  timeout-seconds: 30

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.learnway: DEBUG
    org.flywaydb: INFO
